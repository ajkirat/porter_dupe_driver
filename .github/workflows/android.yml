name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
        env:
          # Set the repo variable DRIVER_APP_URL to point the app at a different host (for example after leaving Netlify).
          DRIVER_APP_URL: ${{ vars.DRIVER_APP_URL }}

      - name: Decode signing key
        if: env.HAS_KEY == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"

      # Without the signing secrets you still get a test APK you can install on your own phone.
      - name: Build test APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: pikop-driver-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build Play Store bundle (release)
        if: env.HAS_KEY == 'true'
        working-directory: android
        run: ./gradlew bundleRelease -PversionCode=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: pikop-driver-play-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
