name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer build replaces an older one that is still running, so the download link always gets the newest APK.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
        env:
          # Set the repo variable DRIVER_APP_URL to point the app at a different host (for example after leaving Netlify).
          DRIVER_APP_URL: ${{ vars.DRIVER_APP_URL }}

      - name: Decode signing key
        if: env.HAS_KEY == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"

      # Without the signing secrets you still get a test APK you can install on your own phone.
      - name: Build test APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: pikop-driver-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Also put the APK on a fixed release, so it can be downloaded straight to a phone (no zip, no GitHub login):
      # https://github.com/${{ github.repository }}/releases/download/test-apk/pikop-driver-test.apk
      - name: Publish test APK as a direct download
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk pikop-driver-test.apk
          gh release view test-apk >/dev/null 2>&1 || gh release create test-apk --prerelease \
            --title "Pikop Driver test APK (latest build)" \
            --notes "Test build for your own phone. Every push to main replaces the APK here. Not for the Play Store."
          gh release upload test-apk pikop-driver-test.apk --clobber

      - name: Build Play Store bundle (release)
        if: env.HAS_KEY == 'true'
        working-directory: android
        run: ./gradlew bundleRelease -PversionCode=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: pikop-driver-play-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
